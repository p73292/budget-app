<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="記帳本">
<meta name="theme-color" content="#ffffff">
<title>記帳本</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ffffff;--bg2:#f5f5f5;--bg3:#efefef;
  --text:#111111;--text2:#666666;--text3:#999999;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.2);
  --green:#1D9E75;--green-bg:#E1F5EE;--green-dark:#0F6E56;
  --red:#D85A30;--red-bg:#FAECE7;--red-dark:#993C1D;
  --blue:#378ADD;--blue-bg:#E6F1FB;
  --radius:10px;--radius-lg:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
    --text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;
    --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
    --green:#30d158;--green-bg:rgba(48,209,88,0.15);--green-dark:#30d158;
    --red:#ff6b35;--red-bg:rgba(255,107,53,0.15);--red-dark:#ff6b35;
    --blue:#64b5f6;--blue-bg:rgba(100,181,246,0.15);
  }
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--bg);color:var(--text);font-size:16px}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--safe-top)}
.header{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:0.5px solid var(--border)}
.header h1{font-size:18px;font-weight:600;color:var(--text)}
.month-nav{display:flex;align-items:center;gap:4px}
.month-nav button{background:var(--bg2);border:none;border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--text2);font-size:15px;font-weight:500}
.month-label{font-size:14px;font-weight:500;color:var(--text);min-width:72px;text-align:center}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 16px;background:var(--bg)}
.scard{background:var(--bg2);border-radius:var(--radius);padding:10px}
.scard-label{font-size:11px;color:var(--text2);margin-bottom:3px}
.scard-value{font-size:17px;font-weight:600;letter-spacing:-0.3px}
.tabs{display:flex;border-bottom:0.5px solid var(--border);background:var(--bg);padding:0 16px}
.tab{flex:1;padding:10px 0;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);border:none;background:none;border-bottom:2px solid transparent}
.tab.active{color:var(--green);border-bottom:2px solid var(--green)}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bottom) + 20px)}
.panel{display:none;padding:12px 16px}
.panel.active{display:block}
.add-form{background:var(--bg2);border-radius:var(--radius-lg);padding:12px;margin-bottom:12px;border:2px solid transparent;transition:border-color 0.2s}
.add-form.edit-mode{border-color:var(--blue)}
.form-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.form-header-title{font-size:13px;font-weight:600;color:var(--text2)}
.cancel-edit-btn{font-size:12px;color:var(--blue);cursor:pointer;background:none;border:none;padding:2px 6px}
.type-toggle{display:flex;gap:6px;margin-bottom:10px}
.type-btn{flex:1;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);text-align:center}
.type-btn.expense.active{background:var(--red-bg);border-color:var(--red);color:var(--red-dark)}
.type-btn.income.active{background:var(--green-bg);border-color:var(--green);color:var(--green-dark)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:11px;color:var(--text2);font-weight:500}
.form-group input,.form-group select{background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);padding:8px 10px;font-size:14px;color:var(--text);height:36px;width:100%;appearance:none;-webkit-appearance:none}
.form-btns{display:flex;gap:8px}
.btn-submit{flex:1;background:var(--green);color:#fff;border:none;border-radius:var(--radius);padding:10px;font-size:15px;font-weight:600;cursor:pointer}
.btn-submit.editing{background:var(--blue)}
.btn-cancel{background:var(--bg3);color:var(--text2);border:none;border-radius:var(--radius);padding:10px 16px;font-size:14px;font-weight:500;cursor:pointer}
.tx-list{display:flex;flex-direction:column;gap:6px}
.tx-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border-radius:var(--radius);padding:10px 12px;border:1.5px solid transparent;transition:border-color 0.2s}
.tx-item.editing{border-color:var(--blue)}
.tx-left{display:flex;align-items:center;gap:10px}
.tx-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-icon.income{background:var(--green-bg)}
.tx-icon.expense{background:var(--red-bg)}
.tx-name{font-size:14px;font-weight:500;color:var(--text)}
.tx-meta{font-size:11px;color:var(--text3);margin-top:1px}
.tx-right{display:flex;align-items:center;gap:4px}
.tx-amount{font-size:15px;font-weight:600;margin-right:4px}
.tx-amount.income{color:var(--green)}
.tx-amount.expense{color:var(--red)}
.tx-edit,.tx-del{background:none;border:none;cursor:pointer;font-size:15px;padding:5px;line-height:1;border-radius:6px}
.tx-edit{color:var(--text3)}
.tx-edit:active{color:var(--blue);background:var(--blue-bg)}
.tx-del{color:var(--text3)}
.tx-del:active{color:var(--red);background:var(--red-bg)}
.empty{text-align:center;padding:3rem 0;color:var(--text3);font-size:14px}
.chart-section{margin-bottom:20px}
.chart-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px}
.chart-wrap{position:relative;width:100%}
.donut-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.legend-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.legend-item{display:flex;align-items:center;justify-content:space-between;font-size:11px}
.legend-left{display:flex;align-items:center;gap:5px}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.legend-name{color:var(--text2)}
.legend-val{font-weight:600;color:var(--text)}
.no-data{text-align:center;padding:1.5rem;color:var(--text3);font-size:12px}
.toast{position:fixed;top:calc(var(--safe-top) + 60px);left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(0,0,0,0.75);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;opacity:0;transition:all 0.25s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>💰 記帳本</h1>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>
  <div class="summary">
    <div class="scard"><div class="scard-label">收入</div><div class="scard-value" id="totalIncome" style="color:var(--green)">$0</div></div>
    <div class="scard"><div class="scard-label">支出</div><div class="scard-value" id="totalExpense" style="color:var(--red)">$0</div></div>
    <div class="scard"><div class="scard-label">結餘</div><div class="scard-value" id="totalBalance">$0</div></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('records',this)">明細</button>
    <button class="tab" onclick="switchTab('analysis',this)">分析</button>
  </div>
  <div class="content">
    <div class="panel active" id="panel-records">
      <div class="add-form" id="addForm">
        <div class="form-header">
          <span class="form-header-title" id="formTitle">新增記錄</span>
          <button class="cancel-edit-btn" id="cancelEditBtn" style="display:none" onclick="cancelEdit()">✕ 取消編輯</button>
        </div>
        <div class="type-toggle">
          <button class="type-btn expense active" id="btn-expense" onclick="setType('expense')">💸 支出</button>
          <button class="type-btn income" id="btn-income" onclick="setType('income')">💵 收入</button>
        </div>
        <div class="form-grid">
          <div class="form-group full">
            <label>說明</label>
            <input type="text" id="txName" placeholder="例：午餐、薪水…">
          </div>
          <div class="form-group">
            <label>金額 (NT$)</label>
            <input type="number" id="txAmount" placeholder="0" min="0" inputmode="numeric">
          </div>
          <div class="form-group">
            <label>日期</label>
            <input type="date" id="txDate">
          </div>
          <div class="form-group full">
            <label>分類</label>
            <select id="txCat">
              <option value="飲食">🍜 飲食</option>
              <option value="交通">🚌 交通</option>
              <option value="購物">🛍️ 購物</option>
              <option value="卡費">💳 卡費</option>
              <option value="娛樂">🎮 娛樂</option>
              <option value="住房">🏠 住房</option>
              <option value="醫療">💊 醫療</option>
              <option value="保險">🛡️ 保險</option>
              <option value="薪水">💰 薪水</option>
              <option value="投資">📈 投資</option>
              <option value="其他">📦 其他</option>
            </select>
          </div>
        </div>
        <div class="form-btns">
          <button class="btn-cancel" id="cancelBtn" style="display:none" onclick="cancelEdit()">取消</button>
          <button class="btn-submit" id="submitBtn" onclick="submitForm()">新增記錄</button>
        </div>
      </div>
      <div class="tx-list" id="txList"></div>
    </div>
    <div class="panel" id="panel-analysis">
      <div class="chart-section">
        <div class="chart-title">每日收支趨勢</div>
        <div class="chart-wrap" style="height:200px"><canvas id="trendChart" role="img" aria-label="每日收支趨勢">每日收支趨勢</canvas></div>
      </div>
      <div class="donut-row">
        <div>
          <div class="chart-title">支出分類</div>
          <div class="chart-wrap" style="height:150px"><canvas id="expenseChart" role="img" aria-label="支出分類">支出分類</canvas></div>
          <div class="legend-list" id="expenseLegend"></div>
        </div>
        <div>
          <div class="chart-title">收入分類</div>
          <div class="chart-wrap" style="height:150px"><canvas id="incomeChart" role="img" aria-label="收入分類">收入分類</canvas></div>
          <div class="legend-list" id="incomeLegend"></div>
        </div>
      </div>
      <div class="chart-section">
        <div class="chart-title">近6個月概覽</div>
        <div class="chart-wrap" style="height:200px"><canvas id="barChart" role="img" aria-label="近6個月收支">近6個月收支</canvas></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
let currentType='expense',currentDate=new Date(),editingId=null;
let transactions=JSON.parse(localStorage.getItem('budgetTx')||'[]');
let trendC,expC,incC,barC;
const catIcons={飲食:'🍜',交通:'🚌',購物:'🛍️',卡費:'💳',娛樂:'🎮',住房:'🏠',醫療:'💊',保險:'🛡️',薪水:'💰',投資:'📈',其他:'📦'};
const catColors=['#1D9E75','#378ADD','#D85A30','#7F77DD','#BA7517','#D4537E','#185FA5','#639922','#3C3489','#888780','#5DCAA5'];
function save(){localStorage.setItem('budgetTx',JSON.stringify(transactions))}
function fmt(n){return 'NT$'+Math.abs(Math.round(n)).toLocaleString()}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function updateMonthLabel(){document.getElementById('monthLabel').textContent=(currentDate.getMonth()+1)+'月 '+currentDate.getFullYear()}
function changeMonth(d){currentDate=new Date(currentDate.getFullYear(),currentDate.getMonth()+d,1);updateMonthLabel();renderAll()}
function setType(t){
  currentType=t;
  document.getElementById('btn-expense').classList.toggle('active',t==='expense');
  document.getElementById('btn-income').classList.toggle('active',t==='income');
  if(!editingId)document.getElementById('txCat').value=t==='income'?'薪水':'飲食';
}
function submitForm(){
  const name=document.getElementById('txName').value.trim();
  const amt=parseFloat(document.getElementById('txAmount').value);
  const cat=document.getElementById('txCat').value;
  const date=document.getElementById('txDate').value;
  if(!name||!amt||amt<=0||!date){showToast('請填寫完整資訊');return}
  if(editingId){
    const idx=transactions.findIndex(t=>t.id===editingId);
    if(idx>-1){transactions[idx]={...transactions[idx],type:currentType,name,amount:amt,category:cat,date};save();showToast('✅ 已更新！');cancelEdit();}
  } else {
    transactions.push({id:Date.now(),type:currentType,name,amount:amt,category:cat,date});
    save();document.getElementById('txName').value='';document.getElementById('txAmount').value='';showToast('✅ 已新增！');
  }
  renderAll();
}
function startEdit(id){
  const tx=transactions.find(t=>t.id===id);if(!tx)return;
  editingId=id;currentType=tx.type;
  document.getElementById('txName').value=tx.name;
  document.getElementById('txAmount').value=tx.amount;
  document.getElementById('txDate').value=tx.date;
  document.getElementById('txCat').value=tx.category;
  document.getElementById('btn-expense').classList.toggle('active',tx.type==='expense');
  document.getElementById('btn-income').classList.toggle('active',tx.type==='income');
  document.getElementById('formTitle').textContent='✏️ 編輯記錄';
  document.getElementById('submitBtn').textContent='儲存變更';
  document.getElementById('submitBtn').classList.add('editing');
  document.getElementById('cancelBtn').style.display='block';
  document.getElementById('cancelEditBtn').style.display='block';
  document.getElementById('addForm').classList.add('edit-mode');
  document.getElementById('addForm').scrollIntoView({behavior:'smooth',block:'start'});
  renderList(getMonthTx());
}
function cancelEdit(){
  editingId=null;
  document.getElementById('txName').value='';
  document.getElementById('txAmount').value='';
  document.getElementById('txDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('txCat').value='飲食';
  currentType='expense';
  document.getElementById('btn-expense').classList.add('active');
  document.getElementById('btn-income').classList.remove('active');
  document.getElementById('formTitle').textContent='新增記錄';
  document.getElementById('submitBtn').textContent='新增記錄';
  document.getElementById('submitBtn').classList.remove('editing');
  document.getElementById('cancelBtn').style.display='none';
  document.getElementById('cancelEditBtn').style.display='none';
  document.getElementById('addForm').classList.remove('edit-mode');
  renderList(getMonthTx());
}
function deleteTransaction(id){
  if(!confirm('確定刪除這筆記錄？'))return;
  if(editingId===id)cancelEdit();
  transactions=transactions.filter(t=>t.id!==id);
  save();renderAll();showToast('🗑️ 已刪除');
}
function getMonthTx(){const ym=monthKey(currentDate);return transactions.filter(t=>t.date&&t.date.startsWith(ym))}
function renderSummary(txs){
  const inc=txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const exp=txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const bal=inc-exp;
  document.getElementById('totalIncome').textContent=fmt(inc);
  document.getElementById('totalExpense').textContent=fmt(exp);
  const el=document.getElementById('totalBalance');
  el.textContent=(bal>=0?'':'-')+fmt(bal);
  el.style.color=bal>0?'var(--green)':bal<0?'var(--red)':'var(--text)';
}
function renderList(txs){
  const el=document.getElementById('txList');
  if(!txs.length){el.innerHTML='<div class="empty">本月尚無記錄<br>開始記帳吧！</div>';return}
  el.innerHTML=[...txs].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`
    <div class="tx-item${editingId===t.id?' editing':''}">
      <div class="tx-left">
        <div class="tx-icon ${t.type}">${catIcons[t.category]||'📦'}</div>
        <div>
          <div class="tx-name">${t.name}</div>
          <div class="tx-meta">${t.category} · ${t.date.slice(5)}</div>
        </div>
      </div>
      <div class="tx-right">
        <span class="tx-amount ${t.type}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</span>
        <button class="tx-edit" onclick="startEdit(${t.id})" aria-label="編輯">✏️</button>
        <button class="tx-del" onclick="deleteTransaction(${t.id})" aria-label="刪除">✕</button>
      </div>
    </div>`).join('');
}
function dc(c){if(c)try{c.destroy()}catch(e){}}
function renderTrend(txs){
  dc(trendC);
  const y=currentDate.getFullYear(),m=currentDate.getMonth();
  const days=new Date(y,m+1,0).getDate();
  const labels=[],incData=[],expData=[];
  for(let d=1;d<=days;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    labels.push(d);
    const day=txs.filter(t=>t.date===ds);
    incData.push(day.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0));
    expData.push(day.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0));
  }
  trendC=new Chart(document.getElementById('trendChart'),{type:'line',data:{labels,datasets:[
    {label:'收入',data:incData,borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,0.1)',tension:0.4,pointRadius:2,borderWidth:2,fill:true},
    {label:'支出',data:expData,borderColor:'#D85A30',backgroundColor:'rgba(216,90,48,0.1)',tension:0.4,pointRadius:2,borderWidth:2,fill:true}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:8,font:{size:10}}},y:{ticks:{callback:v=>'$'+Math.round(v/1000)+'k',font:{size:10}},beginAtZero:true}}}});
}
function renderDonut(cid,lid,txs,type){
  dc(type==='expense'?expC:incC);
  const filtered=txs.filter(t=>t.type===type);
  const catMap={};filtered.forEach(t=>{catMap[t.category]=(catMap[t.category]||0)+t.amount});
  const cats=Object.keys(catMap),vals=cats.map(c=>catMap[c]);
  const total=vals.reduce((s,v)=>s+v,0);
  const legEl=document.getElementById(lid),cvs=document.getElementById(cid);
  if(!cats.length){cvs.style.display='none';legEl.innerHTML='<div class="no-data">無資料</div>';return}
  cvs.style.display='';
  const ch=new Chart(cvs,{type:'doughnut',data:{labels:cats,datasets:[{data:vals,backgroundColor:catColors.slice(0,cats.length),borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'62%'}});
  if(type==='expense')expC=ch;else incC=ch;
  legEl.innerHTML=cats.map((cat,i)=>`<div class="legend-item"><div class="legend-left"><span class="legend-dot" style="background:${catColors[i%catColors.length]}"></span><span class="legend-name">${catIcons[cat]||''}${cat}</span></div><span class="legend-val">${total?Math.round(vals[i]/total*100):0}%</span></div>`).join('');
}
function renderBar(){
  dc(barC);
  const now=new Date(),months=[],incArr=[],expArr=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=monthKey(d);
    const mTx=transactions.filter(t=>t.date&&t.date.startsWith(ym));
    months.push((d.getMonth()+1)+'月');
    incArr.push(mTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0));
    expArr.push(mTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0));
  }
  barC=new Chart(document.getElementById('barChart'),{type:'bar',data:{labels:months,datasets:[
    {label:'收入',data:incArr,backgroundColor:'rgba(29,158,117,0.7)',borderRadius:4},
    {label:'支出',data:expArr,backgroundColor:'rgba(216,90,48,0.7)',borderRadius:4}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:11}}},y:{ticks:{callback:v=>'$'+Math.round(v/1000)+'k',font:{size:10}},beginAtZero:true}}}});
}
function renderAll(){
  const txs=getMonthTx();
  renderSummary(txs);renderList(txs);
  if(document.getElementById('panel-analysis').classList.contains('active')){
    renderTrend(txs);renderDonut('expenseChart','expenseLegend',txs,'expense');renderDonut('incomeChart','incomeLegend',txs,'income');renderBar();
  }
}
function switchTab(panel,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+panel).classList.add('active');
  if(panel==='analysis'){setTimeout(()=>{const txs=getMonthTx();renderTrend(txs);renderDonut('expenseChart','expenseLegend',txs,'expense');renderDonut('incomeChart','incomeLegend',txs,'income');renderBar();},50)}
}
document.getElementById('txDate').value=new Date().toISOString().split('T')[0];
updateMonthLabel();

    {id:5,type:'expense',name:'信用卡帳單',amount:8500,category:'卡費',date:p+'-10'},
    {id:6,type:'income',name:'兼職收入',amount:5000,category:'其他',date:p+'-10'},
    {id:7,type:'expense',name:'電影票',amount:380,category:'娛樂',date:p+'-11'},
    {id:8,type:'expense',name:'壽險保費',amount:3200,category:'保險',date:p+'-15'},
  ];
  save();
}
